name: flota-streaming

x-app: &app
  build: .
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    BEAM_JOB_ENDPOINT: beam-job-server:8099
    VENTANA_SEGUNDOS: "60"
    LATENESS_SEGUNDOS: "120"
    EARLY_SEGUNDOS: "10"
  volumes:
    - ./data:/app/data
    - ./tests:/app/tests

services:
  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1200m

  # Crea los tópicos de la Tarea 1 (3 particiones; retención 7 días / 3 días / 14 días).
  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        T=/opt/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic flota.ubicaciones --partitions 3 --replication-factor 1 --config retention.ms=604800000
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic flota.metricas --partitions 3 --replication-factor 1 --config retention.ms=259200000
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic flota.invalidos --partitions 1 --replication-factor 1 --config retention.ms=1209600000
        $$T --bootstrap-server kafka:9092 --describe

  jobmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 768m
        parallelism.default: 1
    volumes:
      - beam-artifacts:/tmp/beam-artifact-staging
    mem_limit: 900m

  taskmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 1
        taskmanager.memory.process.size: 1536m
        taskmanager.memory.task.off-heap.size: 384m
        taskmanager.memory.managed.fraction: 0.1
        taskmanager.memory.network.min: 64m
        taskmanager.memory.network.max: 64m
        parallelism.default: 1
    volumes:
      - beam-artifacts:/tmp/beam-artifact-staging
    mem_limit: 2800m

  beam-job-server:
    image: apache/beam_flink1.19_job_server:2.74.0
    command:
      - --flink-master=jobmanager:8081
      - --job-host=beam-job-server
      - --flink-conf-dir=/flink-conf
    volumes:
      - ./docker/flink:/flink-conf:ro
      - beam-artifacts:/tmp/beam-artifact-staging
    depends_on:
      - jobmanager
      - taskmanager
    mem_limit: 900m

  # Envía el pipeline a Flink: lee lo que hay en flota.ubicaciones, procesa y termina.
  # docker compose run --rm pipeline
  pipeline:
    <<: *app
    profiles: ["demo"]
    command: ["python", "-m", "flota.pipeline", "--segundos-lectura", "60"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      beam-job-server:
        condition: service_started

  # Herramientas de demo: docker compose run --rm app python -m flota.productor
  app:
    <<: *app
    profiles: ["demo"]
    command: ["python", "-m", "flota.consumidor"]

volumes:
  beam-artifacts:
